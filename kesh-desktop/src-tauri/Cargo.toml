[package]
name = "kesh-desktop"
version = "0.1.0"
description = "Kesh — personal AI assistant, desktop wrapper"
authors = ["Keshri"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "kesh-desktop"
path = "src/main.rs"
